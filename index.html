<!-- Main webpage setup -->

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"> 
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tyler & Aiden COMP 3301 Project</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <h1>Human Pose to Pixel Generation</h1>
    <p id="status">Starting...</p>
    <p id="fps-counter">FPS: --</p>
        
    <div class="controls">
        <button id="pause-button" type="button">Pause Character</button>
        <button id="test-button" type="button">Start FPS Test</button>
    </div>
    <p id="test-result"></p>
    <main>
        <section>
            <h2>Webcam Feed</h2>
            <video id="webcam" autoplay playsinline></video>
        </section>
        <section>
            <h2>Pixel Output</h2>
            <canvas id="pixel-canvas" width="32" height="32"></canvas>
        </section>
    </main>

    <section class="project-info">
        <h2>About This Project</h2>
        <p>
            This app uses MediaPipe Pose Landmarker to detect human body movements through a webcam. Detected landmarks are converted into coordinates on a 32x32 pixel canvas.
        </p>
    </section>
        
    <script type="module" src="javascript/main.js"></script>
</body>
</html>
